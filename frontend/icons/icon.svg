<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.9" />

  <!-- Shield Badge Core -->
  <path d="M256 120 L340 160 V250 C340 310 256 360 256 360 C256 360 172 310 172 250 V160 Z" fill="url(#goldGrad)" opacity="0.2" />

  <!-- Large Approval Checkmark -->
  <path d="M190 230 L235 275 L325 185" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- BPRS HIK MCI Banner Text -->
  <text x="256" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">APPROVAL</text>
  <text x="256" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="4">HIK MCI MOBILE</text>
</svg>
